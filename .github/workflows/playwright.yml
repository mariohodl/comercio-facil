name: Playwright Tests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npm test
      env:
        NODE_ENV: test
        MONGODB_URI: mongodb://localhost:27017/test
        SKIP_EMAILS: true
        AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'static_secret_for_tests_only' }}
        NEXTAUTH_URL: http://localhost:3000
        NEXT_PUBLIC_APP_NAME: "Comercio Fácil Test"
        NEXT_PUBLIC_APP_SLOGAN: "Test Slogan"
        NEXT_PUBLIC_APP_DESCRIPTION: "Test Description"
        SUPER_ADMIN: "admin@test.com"
        RESEND_API_KEY: "re_test_key"
        EMAIL_FROM: "test@example.com"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
